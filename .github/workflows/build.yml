name: Build Windows exe & Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows exe
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: 注入 A_Bogus 签名（来自 Secret ABOGUS_JS）
        shell: bash
        run: |
          mkdir -p sign
          if [ -n "${{ secrets.ABOGUS_JS }}" ]; then
            printf '%s' "${{ secrets.ABOGUS_JS }}" > sign/abogus.js
            echo "abogus.js 已注入"
          else
            echo "::warning::未配置 Secret ABOGUS_JS，构建出的 exe 不含签名，需用户自行放入 sign/abogus.js"
          fi
      - name: 打包 exe
        run: python build\build_windows.py
      - name: 上传 exe
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/抖音作品批量下载器.exe
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 释放磁盘空间（Qt-for-Android 编译较占空间）
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache 2>/dev/null || true
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses-dev \
            cmake libffi-dev libssl-dev patchelf automake build-essential \
            libgtk-3-dev libglib2.0-dev libgstreamer1.0-dev golang curl
      - name: 安装 buildozer
        run: pip install buildozer
      - name: 构建 APK（预装并接受 SDK 许可证后编译，耗时较长）
        run: |
          export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))
          DEFAULT_SDK=/home/runner/.buildozer/android/platform/android-sdk
          export ANDROID_SDK_ROOT=$DEFAULT_SDK
          export ANDROID_HOME=$DEFAULT_SDK
          export ANDROID_SDK_HOME=$DEFAULT_SDK   # 让 sdkmanager 把许可证写进 buildozer 的 SDK 目录本身
          mkdir -p /tmp/ct
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/ct.zip
          unzip -q -d /tmp/ct /tmp/ct.zip
          mv /tmp/ct/cmdline-tools /tmp/ct/latest
          SDKMANAGER=/tmp/ct/latest/bin/sdkmanager
          echo "==> sdkmanager = $SDKMANAGER"
          yes 2>/dev/null | "$SDKMANAGER" --sdk_root=$DEFAULT_SDK --licenses || true
          yes 2>/dev/null | "$SDKMANAGER" --sdk_root=$DEFAULT_SDK "build-tools;37.0.0" "platform-tools" "platforms;android-33" "platforms;android-37" || true
          mkdir -p ~/.android
          cp -rf "$DEFAULT_SDK/licenses" ~/.android/ 2>/dev/null || true
          echo "==> buildozer 默认 SDK 已预装内容："
          ls -1 "$DEFAULT_SDK" 2>/dev/null || echo "（目录稍后由 buildozer 创建，包已写入该路径）"
          echo "==> build-tools 是否就位："
          ls -1 "$DEFAULT_SDK/build-tools" 2>/dev/null || echo "（未安装，需检查）"
          echo "==> 已接受的许可证："
          ls -1 ~/.android/licenses 2>/dev/null || echo "（无，需检查）"
          cd build
          buildozer android debug
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/bin/*.apk
          if-no-files-found: error
