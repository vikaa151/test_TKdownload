name: Build Windows exe & Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows exe
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: 注入 A_Bogus 签名（来自 Secret ABOGUS_JS）
        shell: bash
        run: |
          mkdir -p sign
          if [ -n "${{ secrets.ABOGUS_JS }}" ]; then
            printf '%s' "${{ secrets.ABOGUS_JS }}" > sign/abogus.js
            echo "abogus.js 已注入"
          else
            echo "::warning::未配置 Secret ABOGUS_JS，构建出的 exe 不含签名，需用户自行放入 sign/abogus.js"
          fi
      - name: 打包 exe
        run: python build\build_windows.py
      - name: 上传 exe
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/抖音作品批量下载器.exe
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 释放磁盘空间（Qt-for-Android 编译较占空间）
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache 2>/dev/null || true
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses-dev \
            cmake libffi-dev libssl-dev patchelf automake build-essential \
            libgtk-3-dev libglib2.0-dev libgstreamer1.0-dev golang curl
      - name: 安装 buildozer
        run: pip install buildozer
      - name: 构建 APK（首次下载 SDK/NDK/Qt，自动接受许可证后编译，耗时较长）
        run: |
          cd build
          export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))
          export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          # 第一次：让 buildozer 下载 SDK/NDK（云端无交互会卡在许可证，但 SDK 已落地）
          buildozer android debug || true
          # 强制接受所有 Android SDK 许可证（多管齐下，确保 build-tools;37.0.0 被接受）
          SDKMANAGER=$(find $HOME/.buildozer -name sdkmanager 2>/dev/null | head -n1)
          echo "==> sdkmanager = $SDKMANAGER"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
            yes | "$SDKMANAGER" --accept-license || true
            yes | "$SDKMANAGER" "build-tools;37.0.0" "platform-tools" "platforms;android-33" || true
          else
            echo "::error::未找到 sdkmanager，无法自动接受许可证"
          fi
          # 第二次：许可证已接受，真正开始编译（耗时 20~40 分钟）
          buildozer android debug
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/bin/*.apk
          if-no-files-found: error
