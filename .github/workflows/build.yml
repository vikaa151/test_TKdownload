name: Build Windows exe & Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows exe
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: 注入 A_Bogus 签名（来自 Secret ABOGUS_JS）
        shell: bash
        run: |
          mkdir -p sign
          if [ -n "${{ secrets.ABOGUS_JS }}" ]; then
            printf '%s' "${{ secrets.ABOGUS_JS }}" > sign/abogus.js
            echo "abogus.js 已注入"
          else
            echo "::warning::未配置 Secret ABOGUS_JS，构建出的 exe 不含签名，需用户自行放入 sign/abogus.js"
          fi
      - name: 打包 exe
        run: python build\build_windows.py
      - name: 上传 exe
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/抖音作品批量下载器.exe
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 释放磁盘空间（Qt-for-Android 编译较占空间）
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache 2>/dev/null || true
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses-dev \
            cmake libffi-dev libssl-dev patchelf automake build-essential \
            libgtk-3-dev libglib2.0-dev libgstreamer1.0-dev golang curl
      - name: 安装 buildozer
        run: pip install buildozer
      - name: 准备 python-for-android（锁定 Python 3.11.5，规避最新版默认 3.14 的 bootstrap 头文件缺失）
        run: |
          git clone --depth 1 --branch 2026.5.9 https://github.com/kivy/python-for-android /opt/p4a
          sed -i "s/3\.14\.2/3.11.5/g" /opt/p4a/pythonforandroid/recipes/python3/__init__.py /opt/p4a/pythonforandroid/recipes/hostpython3/__init__.py
          echo "patched python versions:"; grep -nE "version\s*=\s*['\"]3" /opt/p4a/pythonforandroid/recipes/python3/__init__.py /opt/p4a/pythonforandroid/recipes/hostpython3/__init__.py
      - name: 构建 APK（修复 SDK 布局并预接受许可证后编译，耗时较长）
        run: |
          export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))
          # buildozer 1.6.0 实际使用的默认 SDK 路径（日志 Extracting ... to 该路径可证）。
          # 关键点：buildozer 的 sdkmanager_path 只认 <SDK>/tools/bin/sdkmanager
          # （源码 targets/android.py:275），而它自己下载的 commandlinetools 解压到
          # cmdline-tools/bin，路径对不上会报 “sdkmanager does not exist”。
          # 因此这里手动把 commandlinetools 摆到 buildozer 真正要找的 tools/bin 下。
          DEFAULT_SDK=/home/runner/.buildozer/android/platform/android-sdk
          export ANDROID_SDK_ROOT=$DEFAULT_SDK
          export ANDROID_HOME=$DEFAULT_SDK
          export ANDROID_SDK_HOME=$DEFAULT_SDK   # 让 sdkmanager 把许可证写进 buildozer 的 SDK 目录

          # 1) 下载 commandlinetools 并放到 buildozer 真正要找的路径：<SDK>/tools/bin/sdkmanager
          mkdir -p /tmp/ct
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/ct.zip
          unzip -q -d /tmp/ct /tmp/ct.zip
          mkdir -p "$DEFAULT_SDK/tools"
          cp -rf /tmp/ct/cmdline-tools/* "$DEFAULT_SDK/tools/"
          SDKMANAGER="$DEFAULT_SDK/tools/bin/sdkmanager"
          echo "==> sdkmanager = $SDKMANAGER"
          test -x "$SDKMANAGER" && echo "sdkmanager 就位 OK" || { echo "sdkmanager 缺失!"; exit 1; }

          # 2) 预先接受许可证（写进 SDK 目录与 ~/.android/licenses 双保险；
          #    spec 里也已设 android.accept_sdk_license = True，buildozer 会自行喂 y）
          yes 2>/dev/null | "$SDKMANAGER" --sdk_root=$DEFAULT_SDK --licenses || true
          mkdir -p ~/.android
          cp -rf "$DEFAULT_SDK/licenses" ~/.android/ 2>/dev/null || true
          echo "==> 已接受的许可证："
          ls -1 ~/.android/licenses 2>/dev/null || echo "（无，需检查）"

          # 3) buildozer 发现 SDK 目录已存在会跳过自下载，直接用 tools/bin/sdkmanager
          #    自行安装 platform-tools / build-tools / platforms;android-33（许可证已接受，不卡）
          cd build
          buildozer android debug
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/bin/*.apk
          if-no-files-found: error
